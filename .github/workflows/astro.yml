# Workflow for building and deploying an Astro site to GitHub Pages
name: Build & Deploy

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Runs on pull requests
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v6

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v5
        with:
          version: 10.11.1

      - name: "🔧 Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "💾 Cache resume PDF tool installers"
        id: cache-pdf-tools
        uses: actions/cache@v4
        with:
          path: .cache/ci-tools
          key: ${{ runner.os }}-ci-tools-pandoc-3.6.4-wkhtmltox-0.12.6.1-2

      - name: "⬇️ Download PDF tool installers (cache miss)"
        if: steps.cache-pdf-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/ci-tools
          wget -O .cache/ci-tools/pandoc-3.6.4-1-amd64.deb \
            https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-1-amd64.deb
          wget -O .cache/ci-tools/wkhtmltox_0.12.6.1-2.jammy_amd64.deb \
            https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "📝 Check code format"
        run: pnpm run format:check

      - name: "🔧 Install Pandoc and wkhtmltopdf"
        run: |
          sudo apt update
          sudo apt install -y \
            ./.cache/ci-tools/pandoc-3.6.4-1-amd64.deb \
            ./.cache/ci-tools/wkhtmltox_0.12.6.1-2.jammy_amd64.deb

      - name: "📑 Generate Resume PDF"
        run: |
          node scripts/generate-pandoc-resume.mjs
          pandoc temp-resume.md -f markdown -t html -c public/resume/resume-stylesheet.css -s -o resume.html
          wkhtmltopdf \
            --enable-local-file-access \
            --print-media-type \
            --page-size A4 \
            --margin-top 6mm \
            --margin-right 6mm \
            --margin-bottom 6mm \
            --margin-left 6mm \
            resume.html public/resume.pdf

      - name: "📦 Commit Updated PDF"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Force-add the ignored file
          git add -f public/resume.pdf

          # Commit only if there are staged changes
          git diff --cached --quiet || git commit -m "Auto-generate resume PDF"
          git push

      - name: "🔧 Setup Pages"
        id: pages
        uses: actions/configure-pages@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: "🚀 Build with Astro"
        run: |
          pnpm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}

      - name: "📤 Upload artifact"
        uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: "🚀 Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v5
